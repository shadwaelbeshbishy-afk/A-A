<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdulrahman & Asmaa — Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Pinyon+Script&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1ebde;--paper:#f7f3ea;--ink:#4b4737;--gold:#8b8464;--line:#b9b192;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d16;--paper:#292620;--ink:#ece4d0;--gold:#c2b98f;--line:#6b6549}}
:root[data-theme="dark"]{--bg:#1f1d16;--paper:#292620;--ink:#ece4d0;--gold:#c2b98f;--line:#6b6549}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.6;text-align:center}
.script{font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400}
.ar{font-family:'Amiri',serif}
.card{max-width:520px;margin:0 auto;min-height:100vh;position:relative}.hero{display:block;width:100%;height:auto}.info{padding:36px 28px 64px;background:#ece6d8;color:#4b4737}.info .btn{color:#4b4737}.info .venue{color:#4b4737}.info .count b,.info .note{color:#8b8464}
.frame{position:absolute;inset:14px;border:1px solid var(--line);pointer-events:none}
.frame::after{content:"";position:absolute;inset:6px;border:1px solid var(--line);opacity:.6}
.lead{letter-spacing:.14em;color:var(--gold);font-size:17px}
h1{font-weight:500;font-size:34px;letter-spacing:.12em;color:var(--gold);margin:6px 0 30px}
.ring{width:290px;height:290px;margin:0 auto;border-radius:50%;padding:10px;border:1px solid var(--gold);position:relative}
.ring::before{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px dashed var(--line)}
.ring img{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:50%;display:block}
.names{margin:22px 0 4px;font-size:58px;line-height:1.05;color:var(--gold)}
.names span{display:block;font-size:34px;line-height:1.2}
.date{margin:34px 0 10px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.date .side{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;color:var(--gold);letter-spacing:.08em}
.date .num{font-size:64px;line-height:1;color:var(--gold);font-weight:500}
.month{letter-spacing:.3em;font-size:22px;margin-top:30px}
.venue{font-size:32px;margin:18px 0 4px;color:var(--ink)}
.btn{display:inline-block;margin-top:18px;padding:12px 30px;border:1px solid var(--gold);color:var(--ink);text-decoration:none;letter-spacing:.1em;transition:background .25s,color .25s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--bg);outline:none}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.count{display:flex;justify-content:center;gap:22px;margin:38px 0 6px}
.count div{min-width:56px}.count b{display:block;font-size:38px;font-weight:500;color:var(--gold);line-height:1}
.count small{font-size:15px;letter-spacing:.1em}
.note{margin-top:38px;color:var(--gold);font-style:italic}
#seal{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;cursor:pointer;border:0;width:100%;color:var(--ink);font:inherit;transition:opacity 1s,visibility 1s}
#seal.gone{opacity:0;visibility:hidden}
.mono{width:150px;height:150px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font-size:54px;color:var(--gold);box-shadow:0 0 0 8px var(--bg),0 0 0 9px var(--line);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.mono{animation:none}#seal{transition:none}}
@media (max-width:380px){.names{font-size:48px}.ring{width:250px;height:250px}}
body{background:#ece6d8}</style></head><body>
<button id="seal" aria-label="Open invitation"><div class="mono script">A &amp; A</div><span style="letter-spacing:.2em">Tap to open</span></button>
